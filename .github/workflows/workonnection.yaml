name: CI Workonnection

on:
  push:
    branches:
      - main
      - reactVersion
  pull_request:
    branches:
      - main
      - reactVersion
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:

  gitleaks:
    name: Seguranca (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar secrets expostos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8080' }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar linter (ESLint)
        run: npm run lint

      - name: Executar build de producao (TypeScript + Vite)
        run: npm run build

  backend:
    name: Backend (Testes & Build)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_PROFILES_ACTIVE: test
      MONGODB_URI: mongodb://localhost:27017/workonnection_test
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/workonnection_test
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '1234567890-test-client-id.apps.googleusercontent.com' }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
          cache-dependency-path: backend/pom.xml

      - name: Conceder permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes, cobertura JaCoCo (>= 70%) e empacotamento
        run: ./mvnw -B verify

      - name: Publicar resumo de cobertura JaCoCo
        run: |
          python3 - << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          with open('target/site/jacoco/jacoco.csv', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          lc = sum(int(r['LINE_COVERED']) for r in rows)
          lm = sum(int(r['LINE_MISSED']) for r in rows)
          ic = sum(int(r['INSTRUCTION_COVERED']) for r in rows)
          im = sum(int(r['INSTRUCTION_MISSED']) for r in rows)
          mc = sum(int(r['METHOD_COVERED']) for r in rows)
          mm = sum(int(r['METHOD_MISSED']) for r in rows)
          print("### Cobertura de Testes Backend (JaCoCo - Meta Minima: 70%)")
          print("| Metrica | Coberto / Total | Percentual |")
          print("| :--- | :---: | :---: |")
          print(f"| **Linhas (Lines)** | `{lc} / {lc+lm}` | **{lc/(lc+lm)*100:.2f}%** |")
          print(f"| **Metodos (Methods)** | `{mc} / {mc+mm}` | **{mc/(mc+mm)*100:.2f}%** |")
          print(f"| **Instrucoes (Bytecode)** | `{ic} / {ic+im}` | **{ic/(ic+im)*100:.2f}%** |")
          EOF

      - name: Salvar relatorio HTML de cobertura (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7

  docker:
    name: Docker (Build & Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend, gitleaks]

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Validar configuracao do Docker Compose
        run: docker compose config -q

      - name: Validar build da imagem Docker (Backend)
        run: docker build -t workonnection-backend:${{ github.sha }} ./backend

      - name: Validar build da imagem Docker (Frontend)
        run: docker build -t workonnection-frontend:${{ github.sha }} ./frontend
