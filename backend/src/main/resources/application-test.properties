# ===================================================================
# WORKONNECTION - CONFIGURAÇÃO DE TESTES (application-test.properties)
# ===================================================================

# Banco de dados para testes (MongoDB Atlas injetado via secrets na pipeline)
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/workonnection_test}}

# Servidor de Email Mock / Dummy para testes
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@workonnection.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Google OAuth2 Mock para testes
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-test-client-id}
spring.security.oauth2.client.registration.google.client-secret=dummy-test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# Pusher Dummy para testes
pusher.app-id=test-app-id
pusher.key=test-key
pusher.secret=test-secret
pusher.cluster=sa1

# Frontend URL
app.frontend.url=http://localhost:5173
