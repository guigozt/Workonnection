# Ativa o profile local por padrão (sobrescrito em produção)
spring.profiles.active=local

# Remove o DEBUG em produção se quiser, por ora mantém
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# -------------------------------------------------------------------
# CONFIGURAÇÕES PARA PERMITIR SESSÃO (CORS/CROSS-SITE)
# -------------------------------------------------------------------
# Permite que o cookie viaje entre domínios diferentes (ex: vercel -> render)
server.servlet.session.cookie.same-site=none

# Exige HTTPS (Obrigatório quando same-site=none)
server.servlet.session.cookie.secure=true

# -------------------------------------------------------------------
# CONFIGURAÇÕES DE PROXY (OBRIGATÓRIO PARA O RENDER/HEROKU)
# -------------------------------------------------------------------
# Faz o Spring Boot confiar no HTTPS do Render
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# Google OAuth2 client registration (placeholders)
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# Mail (SMTP) configuration placeholders
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your@email.com
spring.mail.password=YOUR_SMTP_PASSWORD
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true