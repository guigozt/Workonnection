# ===================================================================
# WORKONNECTION - CONFIGURAÇÃO GLOBAL E PRODUÇÃO (application.properties)
# ===================================================================

# Ativa o profile local por padrão para desenvolvimento
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# -------------------------------------------------------------------
# BANCO DE DADOS (MongoDB Atlas via variáveis de ambiente)
# -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:}}

# -------------------------------------------------------------------
# SESSÃO E COOKIES (Configuração de Produção / Cross-Site)
# -------------------------------------------------------------------
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# -------------------------------------------------------------------
# CONFIGURAÇÕES DE PROXY (Render/Nuvem)
# -------------------------------------------------------------------
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# -------------------------------------------------------------------
# GOOGLE OAUTH2 (Autenticação Social - via variáveis de ambiente)
# -------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# -------------------------------------------------------------------
# SERVIDOR DE E-MAIL (SMTP - Gmail via variáveis de ambiente)
# -------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:dummy@example.com}
spring.mail.password=${SMTP_PASSWORD:dummy-password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------------------------------------------
# FRONTEND URL
# -------------------------------------------------------------------
app.frontend.url=${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:5173}}

# -------------------------------------------------------------------
# PUSHER CHANNELS (Tempo Real / WebSocket via variáveis de ambiente)
# -------------------------------------------------------------------
pusher.app-id=${PUSHER_APP_ID:}
pusher.key=${PUSHER_KEY:}
pusher.secret=${PUSHER_SECRET:}
pusher.cluster=${PUSHER_CLUSTER:sa1}