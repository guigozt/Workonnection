# ===================================================================
# WORKONNECTION - CONFIGURAÇÃO DE PRODUÇÃO (application.properties)
# ===================================================================

# COMENTADO PARA NÃO QUEBRAR A PRODUÇÃO NA RENDER:
# spring.profiles.active=local

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# -------------------------------------------------------------------
# BANCO DE DADOS (MongoDB Atlas)
# -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI}}

# -------------------------------------------------------------------
# SESSÃO E COOKIES (Configuração de Produção / Cross-Site)
# -------------------------------------------------------------------
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# -------------------------------------------------------------------
# CONFIGURAÇÕES DE PROXY (Render)
# -------------------------------------------------------------------
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto

# -------------------------------------------------------------------
# GOOGLE OAUTH2 (Autenticação Social)
# -------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# -------------------------------------------------------------------
# SERVIDOR DE E-MAIL (SMTP - Gmail)
# -------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------------------------------------------
# URL DO FRONTEND (Produção / Local)
# -------------------------------------------------------------------
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}