# Ativa o profile local por padrão (sobrescrito em produção)
spring.profiles.active=local

# Remove o DEBUG em produção se quiser, por ora mantém
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# -------------------------------------------------------------------
# CONFIGURAÇÕES PARA PERMITIR SESSÃO (CORS/CROSS-SITE)
# -------------------------------------------------------------------
# Permite que o cookie viaje entre domínios diferentes (ex: vercel -> render)
server.servlet.session.cookie.same-site=none

# Exige HTTPS (Obrigatório quando same-site=none)
server.servlet.session.cookie.secure=true

# -------------------------------------------------------------------
# CONFIGURAÇÕES DE PROXY (OBRIGATÓRIO PARA O RENDER/HEROKU)
# -------------------------------------------------------------------
# Faz o Spring Boot confiar no HTTPS do Render
server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto