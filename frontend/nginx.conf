server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao Gzip para acelerar carregamento de JS/CSS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache longo para assets estaticos gerados pelo Vite (possuem hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Suporte a rotas SPA do React Router (equivalente ao vercel.json)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

